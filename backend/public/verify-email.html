<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - Job Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover {
            background: #0056b3;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007AFF;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Job Tracker</div>
        <div id="status" class="status loading">
            <div class="spinner"></div>
            <div>Verifying your email...</div>
        </div>
        <div id="actions" style="display: none;">
            <a href="jobtracker://login?verified=true" class="button">Open App</a>
            <a href="mailto:?subject=Job Tracker App" class="button">Download App</a>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');

        if (!token || !email) {
            showError('Invalid verification link. Missing token or email.');
            return;
        }

        // Verify email
        verifyEmail(token, email);

        async function verifyEmail(token, email) {
            try {
                console.log('Verifying email:', email);
                const response = await fetch(`/api/auth/verify-email?token=${token}&email=${encodeURIComponent(email)}`);
                
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Verification successful:', data);
                    showSuccess('Email verified successfully! You can now log in to your app.');
                    showActions();
                } else {
                    const errorData = await response.json();
                    console.log('Verification failed:', errorData);
                    showError(errorData.error || 'Verification failed. Please try again.');
                }
            } catch (error) {
                console.error('Verification error:', error);
                showError('Network error. Please check your connection and try again.');
            }
        }

        function showSuccess(message) {
            const status = document.getElementById('status');
            status.className = 'status success';
            status.innerHTML = `
                <div style="font-size: 48px; margin-bottom: 10px;">✅</div>
                <div>${message}</div>
            `;
        }

        function showError(message) {
            const status = document.getElementById('status');
            status.className = 'status error';
            status.innerHTML = `
                <div style="font-size: 48px; margin-bottom: 10px;">❌</div>
                <div>${message}</div>
            `;
        }

        function showActions() {
            document.getElementById('actions').style.display = 'block';
        }
    </script>
</body>
</html>
